name: Check Links

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --format markdown
            --exclude-mail
            -- ./README.md
          fail: false
          output: lychee-report.md
      - name: Warn about inactive URLs
        if: steps.lychee.outputs.exit_code != '0'
        run: echo "::warning::Inactive or broken URLs detected. See the lychee-report artifact for details."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lychee-report
          path: lychee-report.md
